import com.android.build.api.artifact.MultipleArtifact
import org.gradle.api.file.DirectoryProperty
import org.gradle.api.file.RegularFileProperty
import org.gradle.api.tasks.OutputDirectory
import org.gradle.api.tasks.OutputFile

plugins { id 'com.android.application' }

abstract class PrepareVstabNativeSymbols extends Exec {
    @OutputDirectory abstract DirectoryProperty getOutputDir()
    @OutputFile abstract RegularFileProperty getCoverageReport()
}

def signingNames = ['ANDROID_KEYSTORE', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
def signingReady = signingNames.every { System.getenv(it) }
if (signingNames.any { System.getenv(it) } && !signingReady) {
    throw new GradleException('All four ANDROID signing variables must be provided together')
}
def releaseVersionCode = System.getenv('VSTAB_VERSION_CODE') ?: '5'
def releaseVersionName = System.getenv('VSTAB_VERSION_NAME') ?: '0.2.0'
def runtimeAbi = System.getenv('VSTAB_RUNTIME_ABI') ?: 'arm64-v8a'
def linuxHostAssets = file(System.getenv('VSTAB_LINUX_ASSETS') ?: '../../.local/linux-runtime/assets')
def linuxGuestAssets = file(System.getenv('VSTAB_LINUX_ASSETS') ?: '../../.local/linux-runtime/guest/assets')
def workbenchAssets = file(System.getenv('VSTAB_WORKBENCH_ASSETS') ?: '../../.local/workbench-linux-assets')
if (!(runtimeAbi in ['arm64-v8a', 'x86_64'])) {
    throw new GradleException('VSTAB_RUNTIME_ABI must be arm64-v8a or x86_64')
}
if (!(releaseVersionCode ==~ /[1-9][0-9]*/) || releaseVersionCode.toLong() > 2100000000) {
    throw new GradleException('VSTAB_VERSION_CODE must be an integer from 1 to 2100000000')
}
if (!(releaseVersionName ==~ /[0-9A-Za-z][0-9A-Za-z.+_-]*/)) {
    throw new GradleException('VSTAB_VERSION_NAME contains unsupported characters')
}

android {
    namespace 'app.vstab'
    compileSdk 36
    buildToolsVersion '36.0.0'
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'com.vstab'
        minSdk 29
        targetSdk 36
        ndk { abiFilters runtimeAbi }
        versionCode releaseVersionCode.toInteger()
        versionName releaseVersionName
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        if (signingReady) {
            upload {
                storeFile file(System.getenv('ANDROID_KEYSTORE'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk { debugSymbolLevel 'SYMBOL_TABLE' }
            if (signingReady) { signingConfig signingConfigs.upload }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main { assets.srcDir layout.buildDirectory.dir('generated/serverAssets') } }
    packaging {
        jniLibs { useLegacyPackaging = true; keepDebugSymbols += ['**/*.so'] }
        resources.excludes += ['META-INF/versions/**', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
    }
    lint { abortOnError true }
}

def requireUploadSigning = tasks.register('requireUploadSigning') {
    doLast {
        if (!signingReady) {
            throw new GradleException('Release builds require all four ANDROID signing variables; use tools/build-android-release.py')
        }
    }
}
tasks.configureEach {
    if (name == 'preReleaseBuild') { dependsOn requireUploadSigning }
}

def prepareServerAssets = tasks.register('prepareServerAssets', Exec) {
    workingDir '../..'
    commandLine 'python3', 'scripts/package-server-assets.py', '--output',
            layout.buildDirectory.dir('generated/serverAssets').get().asFile.absolutePath
    inputs.file('../../server/bootstrap.sh')
    inputs.file('../../scripts/package-server-assets.py')
    inputs.dir('../../workbench/session-tools/extension')
    inputs.dir('../../workbench/compatibility/extension')
    outputs.dir(layout.buildDirectory.dir('generated/serverAssets'))
}
def prepareWorkbenchAssets = tasks.register('prepareWorkbenchAssets', Sync) {
    from(workbenchAssets)
    into(layout.buildDirectory.dir('generated/workbenchAssets'))
    doFirst {
        if (!new File(workbenchAssets, 'workbench/bundle.json').isFile()) {
            throw new GradleException('Missing bundled editor assets. Follow linux-runtime/README.md to package the matching Linux workbench.')
        }
    }
}
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/workbenchAssets'))
def prepareLocalRuntimeAssets = tasks.register('prepareLocalRuntimeAssets', Sync) {
    from(linuxHostAssets) {
        include 'linux-runtime/host-manifest.json', "linux-runtime/host-${runtimeAbi}.zip", 'linux-runtime/host/termux-launch.sh'
    }
    from({
        def manifest = new File(linuxGuestAssets, 'linux-runtime/guest-manifest.json')
        if (!manifest.isFile()) throw new GradleException('Build the Linux guest first.')
        def guest = new groovy.json.JsonSlurper().parse(manifest).architectures[runtimeAbi]
        if (guest == null) throw new GradleException("Build the Linux guest for ${runtimeAbi} first.")
        def required = ['linux-runtime/guest-manifest.json', guest.kernelAsset, guest.diskAsset]
        if (guest.initrdAsset) required.add(guest.initrdAsset)
        fileTree(linuxGuestAssets) { include required }
    })
    into(layout.buildDirectory.dir('generated/localRuntimeAssets'))
    doFirst {
        if (!new File(linuxHostAssets, 'linux-runtime/host-manifest.json').isFile()
                || !new File(linuxGuestAssets, 'linux-runtime/guest-manifest.json').isFile()) {
            throw new GradleException('Build the shared Linux host and guest before assembling the app.')
        }
    }
}
def prepareLocalRuntimeLibraries = tasks.register('prepareLocalRuntimeLibraries', Sync) {
    from('../../.local/linux-runtime/jniLibs') { include "${runtimeAbi}/libqemu-system.so" }
    into(layout.buildDirectory.dir('generated/localRuntimeLibraries'))
    doFirst {
        if (!file("../../.local/linux-runtime/jniLibs/${runtimeAbi}/libqemu-system.so").isFile()) {
            throw new GradleException("Build the shared Linux machine host for ${runtimeAbi} first.")
        }
    }
}
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/localRuntimeAssets'))
android.sourceSets.main.jniLibs.srcDir(layout.buildDirectory.dir('generated/localRuntimeLibraries'))
tasks.named('preBuild').configure { dependsOn prepareServerAssets, prepareWorkbenchAssets, prepareLocalRuntimeAssets, prepareLocalRuntimeLibraries }

// Preserve the checksum-verified runtime ELF bytes while supplying genuine
// matching function tables through AGP's supported bundle metadata artifact.
androidComponents {
    onVariants(selector().withBuildType('release')) { variant ->
        def ndkDirectory = sdkComponents.ndkDirectory
        def symbols = tasks.register("prepare${variant.name.capitalize()}NativeSymbolTables", PrepareVstabNativeSymbols) {
            outputDir.set(layout.buildDirectory.dir("generated/nativeSymbolTables/${variant.name}"))
            coverageReport.set(layout.buildDirectory.file("reports/native-symbols-${variant.name}.json"))
            inputs.file('../../scripts/prepare-android-native-symbols.py')
            dependsOn prepareLocalRuntimeLibraries
            inputs.dir(layout.buildDirectory.dir('generated/localRuntimeLibraries'))
            inputs.files(fileTree('../../.local/linux-runtime/unstripped'))
            inputs.file(new File(linuxHostAssets, 'linux-runtime/host-manifest.json'))
            inputs.property('ndkVersion', android.ndkVersion)
            inputs.property('requireNativeSymbols', System.getenv('VSTAB_REQUIRE_NATIVE_SYMBOLS') ?: '0')
            workingDir '../..'
            doFirst {
                def strict = System.getenv('VSTAB_REQUIRE_NATIVE_SYMBOLS') ?: '0'
                if (!(strict in ['0', '1'])) throw new GradleException('VSTAB_REQUIRE_NATIVE_SYMBOLS must be 0 or 1')
                def arguments = ['python3', 'scripts/prepare-android-native-symbols.py',
                    '--ndk', ndkDirectory.get().asFile.absolutePath,
                    '--jni-root', layout.buildDirectory.dir('generated/localRuntimeLibraries').get().asFile.absolutePath,
                    '--unstripped-root', file('../../.local/linux-runtime/unstripped').absolutePath,
                    '--output', outputDir.get().asFile.absolutePath,
                    '--report', coverageReport.get().asFile.absolutePath,
                    '--allow-stripped-manifest', new File(linuxHostAssets, 'linux-runtime/host-manifest.json').absolutePath]
                if (strict == '1') arguments.add('--require-symbols')
                commandLine arguments
            }
        }
        variant.artifacts.use(symbols).wiredWith { it.outputDir }
            .toAppendTo(MultipleArtifact.NATIVE_SYMBOL_TABLES.INSTANCE)
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    implementation 'com.github.mwiede:jsch:2.28.8'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.87'
    implementation 'org.tukaani:xz:1.12'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'junit:junit:4.13.2'
}
